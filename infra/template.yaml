AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Multi-tenant medallion lakehouse: DMS -> S3 (bronze) -> Glue/PySpark -> Apache Iceberg
  (silver, gold) -> Athena, orchestrated by Step Functions.

Parameters:
  BatchesPerTable:
    Type: Number
    Default: 4
    MinValue: 1
    Description: Tenant batches per table. Each batch is one parallel Glue run.
  GlueMaxConcurrentRuns:
    Type: Number
    Default: 8
    MinValue: 1
    Description: Upper bound on parallel bronze->silver runs (protects account Glue limits).
  GlueWorkers:
    Type: Number
    Default: 2
    MinValue: 2
  ScheduleState:
    Type: String
    Default: DISABLED
    AllowedValues: [ENABLED, DISABLED]
    Description: Enable the hourly pipeline schedule.

Resources:
  # ---------------------------------------------------------------- storage
  LakeBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: bronze-to-infrequent-access
            Status: Enabled
            Prefix: bronze/
            Transitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 30

  ArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  AthenaResultsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-query-results
            Status: Enabled
            ExpirationInDays: 30

  # ---------------------------------------------------------------- catalog
  SilverDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: silver
        Description: Deduplicated, typed, multi-tenant Iceberg tables (one row per source key)
        LocationUri: !Sub s3://${LakeBucket}/warehouse/silver/

  GoldDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: gold
        Description: Business-level Iceberg tables built from SQL models
        LocationUri: !Sub s3://${LakeBucket}/warehouse/gold/

  # ---------------------------------------------------------------- glue
  GlueJobRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: glue.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSGlueServiceRole
      Policies:
        - PolicyName: lakehouse-data
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:ListBucket]
                Resource:
                  - !GetAtt LakeBucket.Arn
                  - !GetAtt ArtifactsBucket.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource:
                  - !Sub ${LakeBucket.Arn}/*
              - Effect: Allow
                Action: [s3:GetObject]
                Resource:
                  - !Sub ${ArtifactsBucket.Arn}/*
              - Effect: Allow
                Action:
                  - glue:GetDatabase
                  - glue:GetTable
                  - glue:GetTables
                  - glue:CreateTable
                  - glue:UpdateTable
                  - glue:DeleteTable
                Resource:
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:catalog
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:database/silver
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:database/gold
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/silver/*
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/gold/*

  BronzeToSilverJob:
    Type: AWS::Glue::Job
    Properties:
      Description: Merge new DMS CDC files for one table / tenant batch into silver Iceberg
      Role: !GetAtt GlueJobRole.Arn
      GlueVersion: "5.0"
      WorkerType: G.1X
      NumberOfWorkers: !Ref GlueWorkers
      Timeout: 120
      ExecutionProperty:
        MaxConcurrentRuns: !Ref GlueMaxConcurrentRuns
      Command:
        Name: glueetl
        PythonVersion: "3"
        ScriptLocation: !Sub s3://${ArtifactsBucket}/glue_jobs/bronze_to_silver.py
      DefaultArguments:
        --datalake-formats: iceberg
        --conf: !Sub >-
          spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
          --conf spark.sql.catalog.glue_catalog=org.apache.iceberg.spark.SparkCatalog
          --conf spark.sql.catalog.glue_catalog.catalog-impl=org.apache.iceberg.aws.glue.GlueCatalog
          --conf spark.sql.catalog.glue_catalog.io-impl=org.apache.iceberg.aws.s3.S3FileIO
          --conf spark.sql.catalog.glue_catalog.warehouse=s3://${LakeBucket}/warehouse/
          --conf spark.sql.defaultCatalog=glue_catalog
        --extra-py-files: !Sub s3://${ArtifactsBucket}/lakehouse.zip
        --lake_bucket: !Ref LakeBucket
        --bronze_prefix: bronze/
        --config_uri: !Sub s3://${ArtifactsBucket}/conf/tables.json
        --batch_index: "0"
        --batch_count: "1"
        --enable-metrics: "true"
        --enable-observability-metrics: "true"
        --enable-continuous-cloudwatch-log: "true"
        --job-language: python

  SilverToGoldJob:
    Type: AWS::Glue::Job
    Properties:
      Description: Rebuild gold Iceberg tables from SQL models
      Role: !GetAtt GlueJobRole.Arn
      GlueVersion: "5.0"
      WorkerType: G.1X
      NumberOfWorkers: !Ref GlueWorkers
      Timeout: 60
      ExecutionProperty:
        MaxConcurrentRuns: 1
      Command:
        Name: glueetl
        PythonVersion: "3"
        ScriptLocation: !Sub s3://${ArtifactsBucket}/glue_jobs/silver_to_gold.py
      DefaultArguments:
        --datalake-formats: iceberg
        --conf: !Sub >-
          spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
          --conf spark.sql.catalog.glue_catalog=org.apache.iceberg.spark.SparkCatalog
          --conf spark.sql.catalog.glue_catalog.catalog-impl=org.apache.iceberg.aws.glue.GlueCatalog
          --conf spark.sql.catalog.glue_catalog.io-impl=org.apache.iceberg.aws.s3.S3FileIO
          --conf spark.sql.catalog.glue_catalog.warehouse=s3://${LakeBucket}/warehouse/
          --conf spark.sql.defaultCatalog=glue_catalog
        --extra-py-files: !Sub s3://${ArtifactsBucket}/lakehouse.zip
        --gold_models_uri: !Sub s3://${ArtifactsBucket}/gold/
        --enable-metrics: "true"
        --enable-continuous-cloudwatch-log: "true"
        --job-language: python

  # ---------------------------------------------------------------- orchestration
  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: states.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: run-glue-jobs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [glue:StartJobRun, glue:GetJobRun, glue:GetJobRuns, glue:BatchStopJobRun]
                Resource:
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:job/${BronzeToSilverJob}
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:job/${SilverToGoldJob}

  Pipeline:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      RoleArn: !GetAtt PipelineRole.Arn
      DefinitionSubstitutions:
        BronzeToSilverJob: !Ref BronzeToSilverJob
        SilverToGoldJob: !Ref SilverToGoldJob
        BatchesPerTable: !Ref BatchesPerTable
      Definition:
        Comment: >-
          Input: {"tables": ["customers", "orders"]}. Fans out one Glue run per
          (table, tenant batch), then rebuilds gold.
        StartAt: PlanBatches
        States:
          PlanBatches:
            Type: Pass
            Parameters:
              tables.$: $.tables
              batches.$: States.ArrayRange(0, States.MathAdd(${BatchesPerTable}, -1), 1)
            Next: ProcessTables
          ProcessTables:
            Type: Map
            ItemsPath: $.tables
            MaxConcurrency: 2
            ItemSelector:
              table.$: $$.Map.Item.Value
              batches.$: $.batches
            ItemProcessor:
              ProcessorConfig: { Mode: INLINE }
              StartAt: ProcessBatches
              States:
                ProcessBatches:
                  Type: Map
                  ItemsPath: $.batches
                  MaxConcurrency: ${BatchesPerTable}
                  ItemSelector:
                    table.$: $.table
                    batch_index.$: States.Format('{}', $$.Map.Item.Value)
                  ItemProcessor:
                    ProcessorConfig: { Mode: INLINE }
                    StartAt: BronzeToSilver
                    States:
                      BronzeToSilver:
                        Type: Task
                        Resource: arn:aws:states:::glue:startJobRun.sync
                        Parameters:
                          JobName: ${BronzeToSilverJob}
                          Arguments:
                            --table.$: $.table
                            --batch_index.$: $.batch_index
                            --batch_count: "${BatchesPerTable}"
                        Retry:
                          - ErrorEquals: [Glue.ConcurrentRunsExceededException]
                            IntervalSeconds: 60
                            MaxAttempts: 5
                            BackoffRate: 2
                          - ErrorEquals: [States.TaskFailed]
                            IntervalSeconds: 120
                            MaxAttempts: 1
                        End: true
                  End: true
            ResultPath: null
            Next: SilverToGold
          SilverToGold:
            Type: Task
            Resource: arn:aws:states:::glue:startJobRun.sync
            Parameters:
              JobName: ${SilverToGoldJob}
            End: true

  ScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: start-pipeline
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: states:StartExecution
                Resource: !Ref Pipeline

  HourlySchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Description: Run the lakehouse pipeline every hour
      ScheduleExpression: rate(1 hour)
      State: !Ref ScheduleState
      FlexibleTimeWindow: { Mode: "OFF" }
      Target:
        Arn: !Ref Pipeline
        RoleArn: !GetAtt ScheduleRole.Arn
        Input: '{"tables": ["customers", "orders"]}'

  # ---------------------------------------------------------------- ingestion + query
  DmsS3TargetRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Used by DMS S3 target endpoints (one per source database) to write bronze/
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: dms.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: write-bronze
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:PutObject, s3:DeleteObject, s3:PutObjectTagging]
                Resource: !Sub ${LakeBucket.Arn}/bronze/*
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt LakeBucket.Arn

  AthenaWorkGroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: !Sub ${AWS::StackName}-analytics
      RecursiveDeleteOption: true
      WorkGroupConfiguration:
        EnforceWorkGroupConfiguration: true
        PublishCloudWatchMetricsEnabled: true
        BytesScannedCutoffPerQuery: 10737418240
        EngineVersion:
          SelectedEngineVersion: Athena engine version 3
        ResultConfiguration:
          OutputLocation: !Sub s3://${AthenaResultsBucket}/results/
          EncryptionConfiguration:
            EncryptionOption: SSE_S3

Outputs:
  LakeBucketName:
    Value: !Ref LakeBucket
  ArtifactsBucketName:
    Value: !Ref ArtifactsBucket
  PipelineArn:
    Value: !Ref Pipeline
  DmsS3TargetRoleArn:
    Value: !GetAtt DmsS3TargetRole.Arn
  AthenaWorkGroupName:
    Value: !Ref AthenaWorkGroup
